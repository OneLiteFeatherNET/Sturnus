{{- if .Values.console.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sturnus.fullname" . }}-console
  labels:
    {{- include "sturnus.componentLabels" (dict "root" . "component" "console") | nindent 4 }}
spec:
  type: {{ .Values.console.service.type }}
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "sturnus.componentSelectorLabels" (dict "root" . "component" "console") | nindent 4 }}
{{- end }}
