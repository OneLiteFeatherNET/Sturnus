apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sturnus.fullname" . }}-worker
  labels:
    {{- include "sturnus.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicaCount }}
  # RollingUpdate, and the reason it can be is that the worker holds no
  # volume any more. It used to mount a ReadWriteOnce model cache, on
  # which a rolling update deadlocks: the new pod stays Pending on a
  # multi-attach error while the old one waits to be replaced. With
  # transcription running at an endpoint the pod is stateless -- `/tmp` is
  # a per-pod `emptyDir` and always was -- so a new pod can start beside
  # the old one and a claimed job simply finishes or has its lease
  # reclaimed (`sturnus.infrastructure.db.queue`).
  #
  # `maxSurge: 1, maxUnavailable: 0` rather than the defaults: a surge is
  # free now, and it keeps one worker polling the queue throughout a
  # deploy instead of leaving the queue unattended for a pod start.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "sturnus.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sturnus.componentLabels" (dict "root" . "component" "worker") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "sturnus.serviceAccountName" . }}
      # worker never calls the Kubernetes API; the projected token would be
      # a standing credential with no job to do.
      automountServiceAccountToken: false
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "sturnus.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          # Exactly the secret keys WorkerSettings declares, one
          # `secretKeyRef` each, rather than `envFrom` over the whole Secret:
          # the map of who gets what, and what that split buys, is on
          # `sturnus.secretEnv` in _helpers.tpl.
          env:
            {{- include "sturnus.secretEnv" (dict "root" . "component" "worker") | nindent 12 }}
            {{- range $k, $v := .Values.commonEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := .Values.worker.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.healthPort }}
              protocol: TCP
          {{- with .Values.worker.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # readOnlyRootFilesystem: true. Covers Python/library scratch
            # writes *and* the decrypted-audio working directory
            # `process_one` uses before transcribing -- see the comment on
            # worker.tmpSizeLimit in values.yaml for why /tmp is that
            # directory and how sure we are of that.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.worker.tmpSizeLimit }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
