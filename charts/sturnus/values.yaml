# Sturnus deploys as three components from one image, differing only in
# `command` and in resources/volumes (Spec 4, Spec 13.5):
#   bot    -- holds the Discord gateway connection and records; replicas: 1,
#             fixed, RWO PVC for the in-progress recording.
#   link   -- the small HTTP service handling the OAuth account-link callback;
#             the only component with any inbound route.
#   worker -- pulls transcription jobs, runs faster-whisper; PVC for the
#             model cache so a restart does not re-download the model.

image:
  repository: harbor.onelitefeather.dev/sturnus/sturnus
  # Defaults to .Chart.AppVersion (kept in lockstep by release-please).
  tag: ""
  pullPolicy: IfNotPresent

# The console runs a different image: it is a Node process and the rest are
# Python. Defaults to the same tag, because the two are released together --
# a console a version behind its API is a console whose pages call endpoints
# that may not exist yet.
consoleImage:
  repository: harbor.onelitefeather.dev/onelitefeather/sturnus-console
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Extra labels applied to every pod of all three components, on top of
# the standard app.kubernetes.io/* set. The cluster's log collection
# selects on a label of its own (`logs.onelitefeather.net/env`), so a
# deployment that cannot set one silently produces uncollected logs --
# Helm ignores values a chart does not declare rather than rejecting
# them, so the omission would surface as missing logs, not as an error.
podLabels: {}

# Name of a Kubernetes Secret that already exists in the namespace (managed
# outside this chart, via SOPS -- Spec 13.5). It must hold exactly these
# seven keys, and each component is given only the subset its own settings
# class declares -- not the whole Secret:
#
#   STURNUS_DISCORD_TOKEN         bot
#   STURNUS_DATABASE_URL          bot, worker, link
#   STURNUS_S3_ACCESS_KEY         bot, worker
#   STURNUS_S3_SECRET_KEY         bot, worker
#   STURNUS_MASTER_KEY            bot, worker
#   STURNUS_OUTLINE_SERVICE_KEY   worker
#   STURNUS_OUTLINE_CLIENT_SECRET link
#
# That distribution is not configurable from here on purpose; it is encoded
# once in the `sturnus.secretEnv` helper in templates/_helpers.tpl, which
# also explains why it is a helper and not a value. A key missing from the
# Secret stops the affected pod at CreateContainerConfigError before its
# container starts, rather than injecting an empty string -- see the same
# helper for why that trade was made deliberately.
#
# The non-secret Outline settings (base URL, OAuth client id, redirect URI)
# are NOT here -- they belong in `commonEnv` below. docs/operations.md
# section 1 carries the full per-component table.
#
# This chart only ever references the Secret by name, through a per-key
# `valueFrom.secretKeyRef`; it never places a secret value into values.yaml
# or a template, and it never creates or templates the Secret itself.
existingSecret: sturnus-secrets

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # None of the three components calls the Kubernetes API, so the projected
  # token is a standing credential with no job to do. Also set explicitly to
  # `false` on every pod spec (belt and suspenders: a pod-level value always
  # wins over this one, but this keeps the ServiceAccount object itself from
  # defaulting a future, differently-configured pod back to `true`).
  automount: false

# Non-secret environment shared by all three components. Component-specific
# non-secret env lives under each component's own `env` map below.
commonEnv:
  STURNUS_HEALTH_PORT: "8080"
  STURNUS_S3_ENDPOINT: "https://s3.onelitefeather.dev"
  STURNUS_S3_BUCKET: "sturnus-audio"
  # Identifies which master key encrypted a recording, so the key can be
  # rotated without re-encrypting existing material (see config.py). Not a
  # credential itself, so it is plain config rather than Secret material.
  STURNUS_MASTER_KEY_ID: "v1"
  # All three components need the Outline base URL; `bot` and `link` also
  # need the OAuth client id and the redirect URI. None of the three is a
  # credential -- an OAuth client id is public by design and the other two
  # are addresses -- so they are plain config rather than Secret material.
  # The defaults below are placeholders in the chart's own example domain:
  # override all three per cluster, and make the redirect URI match the
  # route that actually reaches `link`, or the OAuth flow fails on a
  # redirect_uri mismatch after the user has already consented.
  STURNUS_OUTLINE_BASE_URL: "https://wiki.example.invalid"
  STURNUS_OUTLINE_CLIENT_ID: ""
  STURNUS_OUTLINE_REDIRECT_URI: "https://sturnus.example.invalid/oauth/callback"
  # STURNUS_SENTRY_DSN is deliberately absent here. It travels through the
  # Secret named by `existingSecret`, like every other key in
  # templates/_helpers.tpl's credential lists, and putting it back in this
  # map makes the chart refuse to render rather than quietly publishing it.
  #
  # Not because it is a credential in the usual sense -- it carries Sentry's
  # public key, write-only to one project and granting no read access -- but
  # because the GitOps repository supplying these values is public, and a
  # DSN found there lets anyone fill the project with events.
  #
  # Empty remains the off switch: blank never reaches `sentry_sdk.init()`,
  # so no instrumentation is installed at all (see
  # sturnus/infrastructure/observability.py and
  # `SentrySettings._blank_dsn_is_absent`). A cluster that does not report
  # errors therefore sets the Secret key to the empty string rather than
  # leaving it out. See docs/operations.md section 1.4.
  #
  # Names the deployment in Sentry's environment filter, AND supplies
  # OpenTelemetry's `deployment.environment.name` resource attribute --
  # `sturnus.config.OtelSettings.environment` reads this same variable
  # rather than introducing a second one. One string, so the environment
  # filter in Sentry and the one in Grafana can never disagree. Set per
  # cluster. Not a credential and not secret -- it stays here.
  STURNUS_SENTRY_ENVIRONMENT: "production"

  # Traces and metrics (sturnus/infrastructure/telemetry.py). Empty is the
  # off switch and the default: with no endpoint, no OpenTelemetry provider
  # is constructed at all, so every span in the codebase is a
  # NonRecordingSpan (~0.1us) and every metric call is a no-op. Nothing
  # connects, nothing retries, and no export failure is ever logged.
  #
  # In this cluster the value is the Grafana Alloy OTLP receiver, which
  # fans out to Tempo for traces and to the metric store:
  #
  #   STURNUS_OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy-receiver.grafana.svc:4318"
  #
  # HTTP (4318), not gRPC (4317). Alloy accepts both; the HTTP exporter
  # avoids pulling in grpcio. The path is appended automatically, so give
  # the base URL with no /v1/traces suffix.
  #
  # Not a credential, and note that this is a different judgement from the
  # Sentry DSN above rather than the same one: an OTLP endpoint is a
  # service address that grants nobody anything, so publishing it in the
  # GitOps repository costs nothing. The DSN moved into the Secret because
  # that repository is public and a DSN found there lets anyone fill the
  # project with events -- an argument about who can *write* somewhere,
  # which an endpoint does not carry. See docs/operations.md section 1.4.
  STURNUS_OTEL_EXPORTER_OTLP_ENDPOINT: ""

  # Logging (sturnus/observability/setup.py). `json` is one object per line
  # on stdout, which is what alloy-logs scrapes into Loki; `console` is the
  # human-readable form and is selected automatically when stdout is a TTY.
  STURNUS_LOG_FORMAT: "json"
  # Applies to Sturnus's own loggers ONLY, and DEBUG here is safe: Sturnus's
  # own DEBUG lines are held to ids, counts and durations by the same field
  # registry that governs INFO.
  STURNUS_LOG_LEVEL: "INFO"
  # Everything that is not Sturnus. Raising this to DEBUG does nothing: the
  # value is raised to setup.THIRD_PARTY_FLOOR (INFO) before anything is
  # configured, and the process says so in one WARNING line at startup
  # (event log.level_clamped) so nobody spends an hour thinking the
  # variable is unwired.
  #
  # That floor is a security control, not tidiness. botocore logs the SigV4
  # signature at DEBUG, and discord.ext.voice_recv logs the Discord voice
  # secret key at DEBUG from two different modules (`.reader` and
  # `.gateway`) plus raw packet bytes; discord.http logs whole REST
  # response bodies. A production values.yaml must not be able to put any
  # of that into Loki. Lowering it below INFO is a code change in
  # sturnus/observability/setup.py, deliberately -- see docs/operations.md
  # section 7.2.
  STURNUS_LOG_THIRD_PARTY_LEVEL: "WARNING"

# Every component's health/readiness server listens on this container port
# (see sturnus/infrastructure/health.py); the container image is the same
# for all three, so the port is shared here rather than repeated per component.
healthPort: 8080

# The node label + value `bot` (and, if the cluster needs it, `worker`) is
# pinned to, since bot's PVC binds the pod to a zone within that region
# anyway (Spec 13.5). The real value belongs to the target cluster and is
# expected to be overridden by the environment-specific values file (the
# Kubernetes-FLUX repo's app overlay), not hardcoded here.
region:
  key: topology.kubernetes.io/region
  value: eu-central-1

# Shared across all three components: they run from the same image as the
# same uid/gid, so one pod- and one container-level policy covers bot, link
# and worker alike.
#
# `runAsUser`/`runAsGroup` are pinned to 1000 explicitly rather than left to
# the image default (Dockerfile creates `sturnus` at uid/gid 1000) -- if a
# future image build ever changes that, a mismatch here fails at admission
# instead of silently running as whatever uid the image happens to declare.
# `fsGroup: 1000` is what lets that non-root user write the PVC-backed
# volumes (bot's recordings, worker's model cache): without it the volume is
# mounted root-owned and both writes fail at runtime instead of at deploy.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# `readOnlyRootFilesystem: true` is why every deployment template also
# mounts an emptyDir at /tmp (Python and its libraries write there
# regardless of what the process itself does), and why worker additionally
# sizes /tmp to hold a decrypted audio file, not just interpreter scratch
# space -- see `worker.tmpSizeLimit` below.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true

nodeSelector: {}
tolerations: []

bot:
  # Fixed at 1: two instances would hold two Discord gateway connections and
  # record every session twice. Not exposed as a values knob -- the
  # Deployment template hardcodes both `replicas: 1` and `strategy.type:
  # Recreate` for this reason, so nothing can turn it into a rolling update.
  command: ["sturnus-bot"]
  env:
    STURNUS_RECORDING_DIR: /data/recordings
  # Recordings themselves go straight to the PVC above; this only needs to
  # cover Python/library scratch writes to /tmp under readOnlyRootFilesystem.
  tmpSizeLimit: 256Mi
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # A session is one continuous, unsegmented recording per speaker (Spec
  # 6.4): on SIGTERM the bot must close every file, encrypt it and upload it
  # to S3 before the process is killed. The default 30s grace period would
  # truncate that mid-upload on any multi-hour session and silently discard
  # exactly what the SIGTERM handler exists to save. 21600s (6h) covers the
  # documented `max_session_hours` ceiling plus upload time with margin; size
  # this to the deployed `max_session_hours` if that default ever changes.
  terminationGracePeriodSeconds: 21600
  # Startup is slower than it looks, and on 0.6.0 it outgrew the liveness
  # budget: a `link` pod took 55 seconds from container start to "Link
  # service listening" and was SIGKILLed at 137 by its own liveness probe,
  # which allows 5 + 3x20 seconds and then gives up.
  #
  # The time is import time, not work: the OpenTelemetry SDK and its
  # exporters are a large import graph, and `bot` has 1 CPU of CPU to do
  # it with. A startupProbe is exactly the instrument for that -- liveness
  # and readiness are not evaluated at all until it succeeds, so a slow
  # start cannot be mistaken for a hung process, and once it succeeds the
  # normal cadence takes over. `worker` has had one since the model
  # download made the same point more loudly.
  #
  # 5 minutes of budget, which is far more than the 55 seconds observed:
  # the cost of being generous is that a process genuinely wedged at
  # startup is noticed later, and the cost of being tight is a crash loop
  # on a cold node. Only one of those is a working deployment.
  startupProbe:
    httpGet:
      path: /healthz
      port: health
    periodSeconds: 10
    failureThreshold: 30
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 10
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
  persistence:
    # RWO is sufficient at replicas: 1 (Spec 6.4). Sized for
    # `max_session_hours` x expected speaker count -- roughly 5Gi at four
    # hours and ten speakers per Spec 13.5.
    size: 5Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  pdb:
    enabled: true
    # With a single, fixed replica, `minAvailable: 1` blocks every voluntary
    # eviction -- that is the point: a live recording must not be evicted
    # mid-session (Spec 13.5). It does not protect against a node failure or
    # a manual/forced drain, only against routine, voluntary disruption.
    minAvailable: 1
  service:
    enabled: true
    type: ClusterIP

link:
  command: ["sturnus-link"]
  replicaCount: 2
  env: {}
  # link writes nothing but Python/library scratch to /tmp under
  # readOnlyRootFilesystem -- it is the most locked-down of the three, and
  # the only one reachable from outside the cluster.
  tmpSizeLimit: 128Mi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # Startup is slower than it looks, and on 0.6.0 it outgrew the liveness
  # budget: a `link` pod took 55 seconds from container start to "Link
  # service listening" and was SIGKILLed at 137 by its own liveness probe,
  # which allows 5 + 3x20 seconds and then gives up.
  #
  # The time is import time, not work: the OpenTelemetry SDK and its
  # exporters are a large import graph, and `link` has 200m of CPU to do
  # it with. A startupProbe is exactly the instrument for that -- liveness
  # and readiness are not evaluated at all until it succeeds, so a slow
  # start cannot be mistaken for a hung process, and once it succeeds the
  # normal cadence takes over. `worker` has had one since the model
  # download made the same point more loudly.
  #
  # 5 minutes of budget, which is far more than the 55 seconds observed:
  # the cost of being generous is that a process genuinely wedged at
  # startup is noticed later, and the cost of being tight is a crash loop
  # on a cold node. Only one of those is a working deployment.
  startupProbe:
    httpGet:
      path: /healthz
      port: health
    periodSeconds: 10
    failureThreshold: 30
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
  service:
    enabled: true
    type: ClusterIP
    port: 80

# The console's API. It holds S3 and the master key -- it decrypts audio on
# the way to the browser -- and the OAuth client secret, and deliberately
# never the Discord token: a process that can read every recording ever made
# is not one to also give the ability to act as the bot. That list is
# enforced in `_helpers.tpl` rather than configurable here, for the reason
# stated there.
api:
  command: ["sturnus-api"]
  # Two, because this one is user-facing: a rolling deploy or a drained node
  # must not be a console outage. The session is a signed cookie with no
  # server-side state (see `sturnus.console.session`), so a request may land
  # on either replica -- which is the property that makes more than one
  # replica possible at all.
  replicaCount: 2
  env: {}
  # Writes nothing but Python/library scratch to /tmp under
  # readOnlyRootFilesystem. Decrypted audio never touches disk: it goes from
  # the chunk buffer to the socket, which is the property the whole
  # encryption scheme exists for.
  tmpSizeLimit: 128Mi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      # Higher than `link`'s because this one streams: decrypting a chunk at
      # a time is cheap per chunk and constant per request, and several
      # people playing back at once is the ordinary case rather than the
      # exceptional one.
      cpu: 500m
      memory: 384Mi
  # The same 5-minute budget, for the same reason, as `link` and `bot`: the
  # OpenTelemetry import graph is what takes the time, not work, and a
  # startupProbe is what keeps a slow start from being mistaken for a hung
  # process. See link.startupProbe below for the incident this comes from.
  startupProbe:
    httpGet:
      path: /healthz
      port: health
    periodSeconds: 10
    failureThreshold: 30
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    initialDelaySeconds: 5
    periodSeconds: 10
  service:
    enabled: true
    type: ClusterIP
    port: 80

# The console: a Nuxt server that renders pages and calls the API. The one
# component with no credentials at all -- `_helpers.tpl` refuses outright to
# render a secretKeyRef for it.
console:
  replicaCount: 2
  env: {}
  containerPort: 3000
  tmpSizeLimit: 64Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      # Node's baseline is higher than Python's for a process this small,
      # and a server-side render holds a page's worth of DOM while it works.
      memory: 384Mi
  # Nitro starts in a second or two -- there is no OpenTelemetry import
  # graph here -- but the budget is generous for the same reason it is
  # elsewhere: the cost of being generous is noticing a wedged process
  # later, and the cost of being tight is a crash loop on a cold node.
  startupProbe:
    httpGet:
      path: /sign-in
      port: http
    periodSeconds: 5
    failureThreshold: 24
  livenessProbe:
    httpGet:
      path: /sign-in
      port: http
    initialDelaySeconds: 5
    periodSeconds: 20
  # The same path as liveness, and that is honest rather than lazy: this
  # process has no dependency to be ready for. It renders, and a render that
  # needs the API asks for it per request -- so "can it serve a page" is the
  # whole of what readiness could mean here.
  readinessProbe:
    httpGet:
      path: /sign-in
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
  service:
    enabled: true
    type: ClusterIP
    port: 80

# The bot holds the Discord token, the S3 credentials and the audio master
# key and must never be reachable from outside the cluster; `link` is the
# only component with a public callback (the OAuth redirect) and is
# therefore the only one ever exposed. Following the Outline installation's
# pattern, actual exposure is an external Cloudflare Tunnel Ingress managed
# outside this chart -- so the chart's own route stays disabled by default.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - link.sturnus.example.invalid

worker:
  command: ["sturnus-worker"]
  # Safe to raise: the job queue hands each job to exactly one worker
  # (`FOR UPDATE SKIP LOCKED`). But the model cache below is a
  # ReadWriteOnce volume, so replicas beyond the first only schedule onto
  # the node already holding it -- give each replica its own claim before
  # spreading them across nodes.
  replicaCount: 1
  env:
    STURNUS_MODEL_CACHE_DIR: /data/model-cache
    # Not `large-v3-turbo`: turbo is a distilled decoder, four layers where
    # this has thirty-two, and the accuracy it trades away lands outside
    # English -- which is the only place these meetings happen. It is a
    # latency trade, and nothing here is waiting on latency: transcription
    # is offline, per speaker, after the meeting. `worker.resources` below
    # is where that decision is actually paid for.
    STURNUS_WHISPER_MODEL: large-v3
  # Larger than bot/link's: `process_one` downloads the encrypted object and
  # decrypts it to a WAV before transcribing, both under its work directory
  # (`sturnus.application.worker.process_one`, which creates a
  # `job-<id>-<uuid>` directory per job). That directory is
  # `sturnus.entrypoints.worker`'s `work_dir`, which defaults to /tmp --
  # the path mounted below. Sized for one speaker's decrypted recording plus
  # the encrypted download and interpreter scratch, not just the latter.
  # Setting STURNUS_WORK_DIR to anything outside this mount points the worker
  # at the read-only root filesystem, so the two have to move together.
  tmpSizeLimit: 4Gi
  # Sized for large-v3 at int8_float32 with beam_size 8, which is a
  # different budget from the large-v3-turbo/beam 5 these numbers were set
  # for. Four parts, added up rather than guessed at -- except the last,
  # which peaks before the second one starts and so overlaps it:
  #
  #   * The weights, resident for the life of the process. 1.55B
  #     parameters quantised to one byte each is ~1.55GB, against ~0.81GB
  #     for turbo's 809M. (The checkpoint on the cache volume below is
  #     float16 and twice that; it is quantised while loading, not kept.)
  #   * The decoding buffers, which exist only while a job runs and are
  #     the part that actually scales: the cached attention keys and
  #     values are held per beam, per decoder layer, and large-v3 has 32
  #     decoder layers where turbo has 4. faster-whisper's own published
  #     CPU benchmark for this architecture (large-v2 -- same 1.55B
  #     parameters, same layer counts -- int8, beam 5) peaks at ~2.9GB
  #     all in, i.e. ~1.35GB on top of the weights. beam_size 8 scales
  #     that share by 8/5, so ~2.2GB.
  #   * The process itself -- interpreter, numpy, soxr, boto3, SQLAlchemy,
  #     one decrypted WAV read through it. A few hundred MB; call it 0.5GB.
  #   * The log-mel extraction, which is transient and peaks *before* any
  #     decoding starts, so it overlaps with the second item rather than
  #     adding to it. Linear in the array handed to the model, at roughly
  #     50MB per minute of it: 2.0GB for the 40.2 minutes of speech in a
  #     100-minute session. This is the term nobody costed and the reason
  #     this limit had to be overridden to 12Gi in the deployment repo --
  #     `WhisperEngine` used to hand faster-whisper the *whole* padded
  #     track and mark the speech with `clip_timestamps`, and the library
  #     shrinks the array only in the `vad_filter` branch that setting clips
  #     skips, so extraction scaled with session length and cost 4.94GB for
  #     that same session. It now concatenates the gated speech before the
  #     call (`sturnus.infrastructure.whisper`), which is what makes the
  #     arithmetic here true again and lets the 12Gi override go back to the
  #     6Gi below. For scale: on the old path a four-hour session
  #     extrapolates to ~11.9GB of extraction alone, i.e. it would have
  #     burst even the 12Gi stopgap.
  #
  # ~4.25GB at peak, and measured at **4.11GB** on an x86 CPU pinned to
  # four threads, transcribing 4.7 minutes of German speech -- close enough
  # to the arithmetic above to trust it for longer jobs, since only the
  # second and fourth items grow with the audio and the fourth peaks first.
  # For comparison the previous
  # configuration (large-v3-turbo, int8, beam 5) peaked at 1.96GB, which is
  # why the old 2560Mi limit held.
  #
  # The request is 4Gi (steady state between jobs is
  # closer to 2GB -- the second item is transient), and the limit 6Gi. The
  # limit is the number worth being generous with: exceeding it is an
  # OOMKill in the middle of a transcription, which fails the job, and
  # headroom on a node that has the memory costs nothing until it is
  # needed. cpu stays at 4: large-v3 needs more *time* than turbo, not
  # more parallelism, and the ceiling that time has to stay under is
  # STURNUS_JOB_LEASE_SECONDS (1800s), not this.
  #
  # Measured, that ceiling is further away than it looks. The same run
  # transcribed 282s of speech in 145s -- 1.94x faster than real time,
  # against 4.6x for the old configuration. The gate finds the speech and
  # `WhisperEngine` concatenates it before the model sees it, so both
  # extraction and decoding scale with what was said and not with the padded
  # length of a track: 1800s of lease covers roughly 58 minutes of one
  # person actually talking. That is also what keeps the memory limit off
  # the critical path -- 6Gi covers roughly 60 minutes of one speaker's
  # actual speech (60 x 50MB of extraction + 1.55 + 0.5 ~= 5.1GB) and the
  # lease expires just before that, so for a four-hour session the lease,
  # not this limit, is the number to revisit. Beyond
  # that the lease expires mid-job; with `replicas: 1` (hardcoded in the
  # Deployment template) and the worker processing one job at a time,
  # nothing else can claim it, so the only consequence today is that a
  # restart may reclaim a job that was still running. Raising the worker
  # beyond one replica is what would turn this into two workers
  # transcribing the same recording, and is the moment to revisit the
  # lease.
  resources:
    requests:
      cpu: "4"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 6Gi
  # The model (faster-whisper large-v3) downloads on first start on a cold
  # cache volume, which takes minutes -- not seconds. A startupProbe gives
  # that its own, generous budget: liveness and readiness are not
  # evaluated at all until it succeeds, so a slow download cannot be mistaken
  # for a hung process and cannot trigger a restart loop. Once the startup
  # probe succeeds, liveness/readiness take over on their normal cadence.
  # The budget is what it is because `sturnus.entrypoints.worker` builds
  # the engine -- download, then quantise 1.55B parameters down to int8 --
  # *before* it starts the health server, so nothing answers /healthz until
  # that has finished.
  startupProbe:
    httpGet:
      path: /healthz
      port: health
    periodSeconds: 10
    # 20 minutes. Twice what it was, because large-v3's float16 checkpoint
    # is ~3.1GB against large-v3-turbo's ~1.6GB and the quantisation at the
    # end of it is longer too. This only ever costs anything on a cold
    # cache volume: it is a ceiling, not a wait.
    failureThreshold: 120
  livenessProbe:
    httpGet:
      path: /healthz
      port: health
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: health
    periodSeconds: 10
  persistence:
    # Holds the downloaded model weights so a restart doesn't repeat the
    # download. What lands here is the float16 checkpoint as published,
    # ~3.1GB for large-v3 (Spec 7) -- the int8 quantisation happens in
    # memory at load time and is never written back. Plenty of headroom at
    # 10Gi, and worth keeping: a resize is far more disruptive than the
    # unused gigabytes are expensive.
    size: 10Gi
    storageClassName: ""
    accessMode: ReadWriteOnce
  service:
    enabled: true
    type: ClusterIP
