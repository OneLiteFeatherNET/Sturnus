[project]
name = "sturnus"
version = "0.1.0" # x-release-please-version
description = "Discord voice transcription with Outline document output"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "OneLiteFeather" }]
license = "AGPL-3.0-or-later"
dependencies = [
    "sqlalchemy>=2.0.44",
    "asyncpg>=0.31.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.12.0",
    "cryptography>=44.0",
    "soxr>=0.5",
    "numpy>=2.1",
    "boto3>=1.35",
    "discord-py>=2.6.4",
    "discord-ext-voice-recv>=0.5.2a179",
    "aiohttp>=3.10",
    "jinja2>=3.1",
    "httpx>=0.28",
    "faster-whisper>=1.1",
]

[project.scripts]
sturnus-bot = "sturnus.entrypoints.bot:main"
sturnus-link = "sturnus.entrypoints.link:main"
sturnus-worker = "sturnus.entrypoints.worker:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
lint = ["mypy>=1.19.0", "ruff>=0.14.7"]
test = [
    "moto[s3]>=5.0",
    "psycopg[binary]>=3.2",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "testcontainers[postgres]>=4.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff >=0.15 lints/formats *.md by default; docs/ holds prose specs and plans,
# not source, and their embedded code fences are illustrative, not real modules.
# migrations/versions/ is regenerated verbatim by `alembic revision --autogenerate`;
# hand-editing it to satisfy the lint config would only drift from what the tool
# produces next time. migrations/env.py is hand-written logic (URL resolution) and
# stays linted like the rest of the source tree.
extend-exclude = ["docs", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
# scripts/ is included because check_lock_version.py runs in CI: a script
# the pipeline depends on deserves the same checking as the package.
files = ["src", "tests", "scripts"]
# pydantic-settings populates its fields from the environment, so a
# zero-argument Settings() is correct. Without this plugin mypy reads it as a
# call missing every required argument.
plugins = ["pydantic.mypy"]

# These three ship no type information. Strictness stays intact for our own
# code; without this block the test run fails on import-untyped without an
# actual defect in the code.
[[tool.mypy.overrides]]
module = ["testcontainers.*", "alembic.*", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: exercises real model inference (e.g. downloads a Whisper model from HuggingFace); deselected on pull requests, run on push to main and on a schedule -- see .github/workflows/build.yml",
]
