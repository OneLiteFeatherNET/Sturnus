name: chart

# Separate from `build`, which covers the Python package: a chart defect has
# its own failure mode. Helm accepts values a chart never declares and drops
# them silently, so a Kubernetes-FLUX release can set a value that reaches
# nothing and the deployment still comes up -- just without whatever that
# value was meant to do. Rendering here is what turns that into a red check.
on:
  pull_request:
    paths:
      - 'charts/**'
      - '.github/workflows/chart.yml'
      # The chart's per-component credential lists are compared against these
      # below, so a settings class changing has to re-run this job.
      - 'src/sturnus/config.py'
      - 'src/sturnus/entrypoints/**'
      - 'scripts/component_credentials.py'
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - 'src/sturnus/config.py'
      - 'src/sturnus/entrypoints/**'

permissions:
  contents: read

concurrency:
  group: chart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v5
      # The per-component credential lists asserted below are derived from the
      # settings classes rather than restated here, so this job needs the
      # package importable.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups --locked

      - name: helm lint
        run: helm lint charts/sturnus

      - name: Render with defaults
        run: helm template sturnus charts/sturnus > /tmp/default.yaml

      # The values the cluster actually deploys with, kept here rather than in
      # the FLUX repository so a chart change that stops honouring one of them
      # fails in this repository, where the chart is edited. Mirrors
      # apps/clusters/feathre-core/base-apps/sturnus/release.yaml in
      # OneLiteFeatherNET/Kubernetes-FLUX.
      - name: Render with the cluster's values
        run: |
          cat > /tmp/cluster-values.yaml <<'EOF'
          podLabels:
            logs.onelitefeather.net/env: prod
          commonEnv:
            STURNUS_S3_ENDPOINT: "http://rook-ceph-rgw-feather-s3.rook-ceph-fr01.svc:80"
            STURNUS_S3_BUCKET: "sturnus-audio"
          region:
            key: topology.kubernetes.io/region
            value: fr-rosenau
          httpRoute:
            enabled: false
          EOF
          helm template sturnus charts/sturnus -f /tmp/cluster-values.yaml > /tmp/cluster.yaml

      # Each assertion below is a defect that reached main once.
      - name: Assert the rendered manifests hold
        run: |
          python3 - <<'PY'
          import sys, yaml

          def load(path):
              with open(path) as fh:
                  return [d for d in yaml.safe_load_all(fh) if d]

          failures = []

          def check(ok, msg):
              if not ok:
                  failures.append(msg)

          default = load('/tmp/default.yaml')
          cluster = load('/tmp/cluster.yaml')

          deployments = {d['metadata']['name']: d for d in cluster
                         if d['kind'] == 'Deployment'}
          check(len(deployments) == 3,
                f'expected 3 Deployments, rendered {sorted(deployments)}')

          # A Deployment that mounts a ReadWriteOnce claim cannot roll: the new
          # pod blocks on a multi-attach error while the old one holds the
          # volume, and the rollout never completes.
          rwo_claims = {p['metadata']['name'] for p in cluster
                        if p['kind'] == 'PersistentVolumeClaim'
                        and p['spec']['accessModes'] == ['ReadWriteOnce']}
          for name, dep in deployments.items():
              spec = dep['spec']['template']['spec']
              claims = {v['persistentVolumeClaim']['claimName']
                        for v in spec.get('volumes', [])
                        if 'persistentVolumeClaim' in v}
              if claims & rwo_claims:
                  strategy = dep['spec'].get('strategy', {}).get('type')
                  check(strategy == 'Recreate',
                        f'{name} mounts a ReadWriteOnce claim {sorted(claims & rwo_claims)} '
                        f'but its strategy is {strategy!r}, not Recreate')

          # podLabels must reach every pod, and must never reach a selector:
          # selectors are immutable on a live Deployment.
          for name, dep in deployments.items():
              pod_labels = dep['spec']['template']['metadata']['labels']
              check(pod_labels.get('logs.onelitefeather.net/env') == 'prod',
                    f'{name} pods do not carry the cluster log label; '
                    f'podLabels is not wired into this component')
              selector = dep['spec']['selector']['matchLabels']
              check(not any(k.startswith('logs.') for k in selector),
                    f'{name} leaks podLabels into selector.matchLabels {selector}')

          # Without podLabels nothing extra may appear -- the value has to be
          # opt-in, or a chart user gets labels they never asked for.
          for dep in (d for d in default if d['kind'] == 'Deployment'):
              labels = dep['spec']['template']['metadata']['labels']
              check(not any(k.startswith('logs.') for k in labels),
                    f"{dep['metadata']['name']} carries a log label with no podLabels set")

          # The secrets live in a Kubernetes Secret; a plaintext env value for
          # one of them would mean the chart grew a way to leak it.
          for name, dep in deployments.items():
              for container in dep['spec']['template']['spec']['containers']:
                  for env in container.get('env') or []:
                      check('value' not in env or 'TOKEN' not in env['name'].upper(),
                            f"{name} sets {env['name']} as a literal env value")

          # Every component gets exactly the secret keys its own settings
          # class declares, and no others. This is the assertion that fails
          # if a component regains a credential it does not read -- the
          # regression being guarded is `link`, the only component reachable
          # from outside the cluster (the OAuth callback, published through
          # the Cloudflare Tunnel), being handed STURNUS_MASTER_KEY, the key
          # that wraps every recording's data key. `envFrom` over the whole
          # Secret did exactly that, silently, because the pod still ran.
          import json, subprocess
          expected_secret_keys = {
              k: set(v)
              for k, v in json.loads(
                  subprocess.run(
                      ['uv', 'run', 'python', 'scripts/component_credentials.py'],
                      capture_output=True, text=True, check=True,
                  ).stdout
              ).items()
          }

          check(set(deployments) == set(expected_secret_keys),
                f'expected Deployments {sorted(expected_secret_keys)}, '
                f'rendered {sorted(deployments)}')
          for name, expected in expected_secret_keys.items():
              dep = deployments.get(name)
              if dep is None:
                  continue
              for container in dep['spec']['template']['spec']['containers']:
                  # envFrom takes the whole Secret in one go, which is what
                  # this per-key wiring replaced; there is no way to assert a
                  # key set against it, so it must not come back.
                  check(not container.get('envFrom'),
                        f'{name}/{container["name"]} uses envFrom, which hands it '
                        f'every key in the Secret regardless of what it reads')
                  got = set()
                  for env in container.get('env') or []:
                      ref = (env.get('valueFrom') or {}).get('secretKeyRef')
                      if not ref:
                          continue
                      got.add(env['name'])
                      check(ref.get('name') == 'sturnus-secrets',
                            f'{name} reads {env["name"]} from Secret '
                            f'{ref.get("name")!r}, not from existingSecret')
                      check(ref.get('key') == env['name'],
                            f'{name} maps Secret key {ref.get("key")!r} onto env '
                            f'{env["name"]} -- the two must match')
                      # Deliberately not optional: a key missing from the
                      # Secret must stop the pod, not inject an empty string
                      # that pydantic accepts for a required SecretStr.
                      check(not ref.get('optional'),
                            f'{name} marks {env["name"]} optional, so a missing key '
                            f'silently becomes an empty value')
                  check(got == expected,
                        f'{name} receives secret keys {sorted(got)}, expected '
                        f'{sorted(expected)}; extra={sorted(got - expected)} '
                        f'missing={sorted(expected - got)}')

          if failures:
              print('\n'.join(f'::error::{f}' for f in failures))
              sys.exit(1)
          print(f'{len(deployments)} Deployments rendered and asserted')
          PY
