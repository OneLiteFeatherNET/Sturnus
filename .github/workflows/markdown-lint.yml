name: markdown-lint

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.md'

jobs:
  lint:
    uses: OneLiteFeatherNET/workflows/.github/workflows/markdown-lint.yml@v2.8.1
    with:
      # The central default glob is `**/*.md`, which both tools receive verbatim.
      # Under a plain shell that expands to subdirectories only -- README.md is at
      # the root and gets skipped, and with docs/ and CHANGELOG.md excluded below
      # lychee is then left with nothing to check and fails on an empty link set.
      glob: "*.md **/*.md"
      # The central default is `.markdownlint.json`, which this repo does not have --
      # markdownlint-cli2 then throws and the job is always red.
      config-file: .markdownlint-cli2.jsonc
      # docs/, .superpowers/ and scripts/ are prose specs, plans, task reports, and
      # manual verification transcripts, not maintained documentation -- the last of
      # those quotes placeholder Discord URLs that resolve to nothing. CHANGELOG.md is
      # generated by release-please and its compare links point at the tag the release
      # PR has not created yet, so lychee 404s on every release PR. All four are
      # already excluded from markdownlint via `ignores` in .markdownlint-cli2.jsonc;
      # lychee is a separate step that does not read that config, so it needs its own
      # exclusion.
      lychee-args: "--max-redirects 5 --accept 200..=204,429 --no-progress --exclude-path CHANGELOG.md --exclude-path docs --exclude-path .superpowers --exclude-path scripts"
    secrets: inherit
