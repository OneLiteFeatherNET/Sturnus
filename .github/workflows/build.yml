name: build

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly run so the `slow` tests (real Whisper model download + inference)
    # stay exercised somewhere, even though pull requests deselect them.
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # release-please bumps pyproject.toml and charts/sturnus/Chart.yaml through
      # `# x-release-please-version` marker comments, but uv.lock cannot carry a
      # marker: `uv lock` rewrites the file and strips comments. The lock still
      # records this project's own version, in the `version` field of its
      # [[package]] entry for "sturnus", so release-please updates that field
      # through the `toml` extra-file entry in release-please-config.json.
      #
      # That updater fails silently. When its JSONPath matches nothing it logs a
      # warning, leaves uv.lock untouched and still opens the release PR, and the
      # only symptom is `uv sync --all-groups --locked` below failing with "The
      # lockfile at `uv.lock` needs to be updated, but `--locked` was provided" --
      # which reads like a contributor forgot to run `uv lock` and says nothing
      # about release-please. This check names the real cause instead.
      #
      # It is not redundant with `--locked`, which catches the same drift one step
      # later with the misleading message; it is here to make a silently skipped
      # updater diagnosable. Two things can silence that updater: the `.value` in
      # the filter `$.package[?(@.name.value=='sturnus')].version` is
      # load-bearing, because release-please parses TOML into {start, end, value}
      # scalars so it can splice bytes, and the textbook spelling
      # `@.name=='sturnus'` therefore matches nothing; and no upstream test covers
      # filter expressions at all, so a release-please upgrade can break it
      # without a changelog entry. Do not "correct" that path.
      - name: uv.lock must pin the same version as pyproject.toml
        run: python3 scripts/check_lock_version.py
      - run: uv sync --all-groups --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Pull requests deselect `slow` (real Whisper model download + inference from
      # HuggingFace): it is slow and depends on a third party being reachable. It
      # still runs on push to main and on the weekly schedule above.
      - name: Run tests (pull requests skip slow tests)
        if: github.event_name == 'pull_request'
        run: uv run pytest -v -m "not slow"
      - name: Run tests (including slow tests)
        if: github.event_name != 'pull_request'
        run: uv run pytest -v
